name: CI

on:
  push:
    branches: [master]
  pull_request:

# Each test group is its own job so they run in parallel (Linux, Python 3.11).
# Every job records coverage; `coverage` merges them and fails when the tests
# leave too much of src/prepds unexecuted. `CI passed` is the single check that
# branch protection requires: it succeeds only if every job above it did.
jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: cov-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      # everything not owned by the webapp/annotation jobs, so new test files are never skipped
      - name: Run tests/ (all except the webapp, annotation and dcs groups)
        run: >-
          pytest tests/ -q -n auto --cov=prepds --cov-report=
          --ignore=tests/review --ignore=tests/annotation --ignore=tests/dcs
      - uses: actions/upload-artifact@v4
        with: {name: cov-backend, path: cov-backend}

  dcs:
    name: dcs tests
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: cov-dcs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      - name: Run tests/ (dcs group, the largest)
        run: pytest -q -n auto --cov=prepds --cov-report= tests/dcs
      - uses: actions/upload-artifact@v4
        with: {name: cov-dcs, path: cov-dcs}

  webapp:
    name: review web app tests
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: cov-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      - name: Run tests/ (review web app group)
        run: pytest -q -n auto --cov=prepds --cov-report= tests/review
      - uses: actions/upload-artifact@v4
        with: {name: cov-webapp, path: cov-webapp}

  annotation:
    name: annotation and model tests
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: cov-annotation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      # torch tests skip themselves (no [ml] extra), so train.py / crop_classifier.py / model_tracker.py stay uncovered here
      - name: Run tests/ (annotation and model group)
        run: pytest -q -n auto --cov=prepds --cov-report= tests/annotation
      - uses: actions/upload-artifact@v4
        with: {name: cov-annotation, path: cov-annotation}

  coverage:
    name: test coverage
    needs: [backend, dcs, webapp, annotation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e . coverage
      - uses: actions/download-artifact@v4
        with: {pattern: cov-*, merge-multiple: true}
      - run: coverage combine cov-backend cov-dcs cov-webapp cov-annotation
      # ponytail: one global floor; raise it as tests are added, or move to per-module floors
      - run: coverage report --show-missing --skip-covered --fail-under=85

  ci-passed:
    name: CI passed
    needs: [backend, dcs, webapp, annotation, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
