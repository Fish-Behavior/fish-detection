name: CI

on:
  push:
    branches: [master]
  pull_request:

# Linux, Python 3.11. A pull request runs only the backend units it touched
# (backend/shared/scripts/changed_tests.py): units never import each other, and a change to
# shared files (backend/shared, pyproject.toml, uv.lock, Docker, CI) selects all of them.
# A push to master runs everything. `CI passed` is the single check that branch protection
# requires: it succeeds when no job failed; jobs skipped because their unit is untouched are fine.
jobs:
  changes:
    name: select tests
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.pick.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            units=$(python3 backend/shared/scripts/changed_tests.py --base "origin/${{ github.base_ref }}" --list)
          else
            units=$(python3 backend/shared/scripts/changed_tests.py --all --list)
          fi
          echo "units=$units" >> "$GITHUB_OUTPUT"
          echo "Selected: ${units:-nothing}"

  prepds:
    name: prepds tests
    needs: changes
    if: contains(needs.changes.outputs.units, 'prepds')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      # torch tests skip themselves (no [ml] extra), so train.py / crop_classifier.py / model_tracker.py stay uncovered here
      # ponytail: one floor per unit; raise it as tests are added
      - run: pytest -q -n auto backend/prepds/tests --cov=prepds --cov-report=term-missing:skip-covered --cov-fail-under=85

  dcs:
    name: dcs tests
    needs: changes
    if: contains(needs.changes.outputs.units, 'dcs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: pytest -q -n auto backend/dcs/tests --cov=dcs --cov-report=term-missing:skip-covered --cov-fail-under=85

  shared:
    name: shared tests
    needs: changes
    if: contains(needs.changes.outputs.units, 'shared')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: pytest -q backend/shared/tests

  ci-passed:
    name: CI passed
    needs: [changes, prepds, dcs, shared]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
