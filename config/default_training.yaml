# Default settings for the compound/dose classifier (`dcs`, docs/classifier_PRD.md §7.3).
#
# Override any value with your own YAML (DCS_CONFIG or `python -m dcs --config my.yaml`);
# only the keys you list are changed, nested sections merge key by key. A key that does
# not exist here is an error, so a typo cannot be silently ignored.
#
# These defaults carry no data-derived numbers: thresholds read from the real data are
# decided at gate G1 from the `dcs audit` report and set in an override file.

training:
  # One seed controls splits, initialization and shuffling (PRD NFR-1).
  seed: 0
  # Folds per cross-validation repeat, for both schemes (PRD §6.4).
  folds: 5
  # Cross-validation repeats with different seeds; the spread across them is the
  # "better by more than the spread" yardstick of PRD §6.6.
  repeats: 5
  # Classes with fewer fish are dropped; exactly this many are flagged "very small" (PRD §5.6, Q4).
  min_class_size: 6
  # A state's features are dropped when fewer fish show that state at all (PRD §5.3, Q16).
  min_state_fish: 10
  # compound (Stage 1), dose (Stage 2, exploratory) or both.
  stage: both
  # Models to train; majority and date_only are the baselines every result is shown next to.
  models: [majority, date_only, logreg, random_forest, hist_gb, mlp]
  # Feature-group switches (each is also reported as an ablation, PRD §6.8).
  use_ntt: true
  use_demographics: false
  # Depth from the frame top encodes camera framing; off until the G1 framing check (D-015).
  use_depth: false
  normalize_by_date_vehicle: false
  # Flag (never drop) recordings whose length falls outside [min, max] seconds (EC-11).
  # null = no range check; set it at G1 from the protocol and the audit.
  duration_range_s: null
  # Flag (never drop) fish whose share of detected frames is below this (EC-11, D-021).
  min_detected_fraction: 0.8

  # PyTorch MLP (PRD §6.3); only used when torch is installed.
  mlp:
    hidden_sizes: [128, 64]
    dropout: 0.3
    learning_rate: 0.001
    weight_decay: 0.01
    batch_size: 32
    max_epochs: 300
    # Epochs without improvement on the inner validation split before stopping.
    patience: 20
    # Share of each training fold held out as the inner validation split for early stopping.
    inner_val_fraction: 0.2
    # Number of initialization seeds per fold; the report shows their mean and spread.
    seeds: 5
