# Default, data-independent settings for the fishbehavior pipeline.
#
# Do NOT edit this file for a local run. Instead create your own YAML with only
# the values you want to change and point FISH_CONFIG at it (see .env.example).
# Values fitted on real data (e.g. calibrated thresholds) are written to the
# output folder, never here, so no data-derived numbers end up in Git.
#
# Each pipeline step adds its own section to this file in its own PR.

run:
  # How much the pipeline prints: DEBUG, INFO, WARNING or ERROR
  log_level: INFO

catalog:
  # Worksheet holding the trial table: its name, or 0 for the first sheet.
  sheet: 0
  # File types treated as videos when scanning FISH_VIDEO_DIR (case does not matter).
  video_extensions: [".mp4", ".avi", ".mov", ".mkv"]
  # Pattern searched in each video file name (without extension). It must capture
  # `subject` (number). Any letter prefix is skipped and carries no meaning -- the
  # leading "F" is an archive prefix, not a sex code, and sex comes from the
  # workbook. Three optional groups follow the number:
  #   `part`     a letter -- F_0176A, F_0012_b, F_0012-b
  #   `part_num` the number in "(P1)"/"(P2)" -- F_0021(P1); same meaning as `part`
  #   `copy`     the number in a trailing " (2)" -- F_309 (2): a second COMPLETE
  #              take of the trial, not a part of it, so it is never auto-matched.
  video_name_pattern: '(?<![A-Za-z0-9])(?:[A-Za-z]+_)?(?P<subject>\d+)(?:\s*\(P(?P<part_num>\d+)\)|[_-]?(?P<part>[A-Z]))?(?:\s*\((?P<copy>\d+)\))?$'
