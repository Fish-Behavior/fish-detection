# Default, data-independent settings for the fishbehavior pipeline.
#
# Do NOT edit this file for a local run. Instead create your own YAML with only
# the values you want to change and point FISH_CONFIG at it (see .env.example).
# Values fitted on real data (e.g. calibrated thresholds) are written to the
# output folder, never here, so no data-derived numbers end up in Git.
#
# Each pipeline step adds its own section to this file in its own PR.

run:
  # How much the pipeline prints: DEBUG, INFO, WARNING or ERROR
  log_level: INFO

catalog:
  # Worksheet holding the trial table: its name, or 0 for the first sheet.
  sheet: 0
  # File types treated as videos when scanning FISH_VIDEO_DIR (case does not matter).
  video_extensions: [".mp4", ".avi", ".mov", ".mkv"]
  # Pattern searched in each video file name (without extension). It must capture
  # `subject` (number). Any letter prefix is skipped and carries no meaning -- the
  # leading "F" is an archive prefix, not a sex code, and sex comes from the
  # workbook. Three optional groups follow the number:
  #   `part`     a letter -- F_0176A, F_0012_b, F_0012-b
  #   `part_num` the number in "(P1)"/"(P2)" -- F_0021(P1); same meaning as `part`
  #   `copy`     the number in a trailing " (2)" -- F_309 (2): a second COMPLETE
  #              take of the trial, not a part of it, so it is never auto-matched.
  video_name_pattern: '(?<![A-Za-z0-9])(?:[A-Za-z]+_)?(?P<subject>\d+)(?:\s*\(P(?P<part_num>\d+)\)|[_-]?(?P<part>[A-Z]))?(?:\s*\((?P<copy>\d+)\))?$'

scene:
  # Frames sampled evenly over each video. They give the empty-beaker background
  # (below) and the activity map.
  n_background_frames: 100
  # Background = this per-pixel brightness percentile of the sampled frames. The fish
  # is darker than the water, so a high percentile keeps the empty water even where a
  # large fish swims in many of the frames (a median, 50, keeps a "ghost" fish there).
  # Use 50 for a fish that is lighter than the background.
  background_percentile: 90
  # How the activity map (where the fish moved) decides that a pixel changed:
  #   both  - brighter/darker AND different in color. Ignores light flicker, camera
  #           exposure changes and glare on the water (these change brightness, not
  #           color) and the faint colored reflection in the glass. Best for colored fish.
  #   color - different in color only (hue/saturation, lightness ignored).
  #   gray  - brighter/darker only. Use this for fish without color.
  activity_method: both
  # Brightness difference from the background (0-255) that counts as "changed". Each
  # frame's overall brightness change (lights, auto exposure) is removed first.
  diff_threshold: 18
  # Color difference (distance in the a*/b* color plane of CIELAB, 0-~180) that counts
  # as "changed" for the color / both methods.
  color_threshold: 8
  # The activity map is computed on frames shrunk to at most this width (pixels), so
  # large videos stay fast and small in memory; the map is scaled back to full size.
  analysis_max_width: 640
  # Separate patches of activity smaller than this fraction of the largest patch are
  # dropped (specks from noise or a brief light change, far from where the fish swims).
  activity_min_component_fraction: 0.05
  # A pixel belongs to the fish's area when it differed from the background in at
  # least this fraction of the sampled frames (drops single noisy frames).
  activity_min_fraction: 0.02
  # Padding added around the activity box on each side, as a fraction of the frame
  # width (left/right) and height (top/bottom).
  roi_padding_fraction: 0.03
  # Rows searched for the waterline, as fractions of the activity-box height measured
  # from the box top: [-0.25, 0.5] = from a quarter box-height ABOVE the box top down
  # to the box middle. Starting above the box finds the surface even if the fish never
  # reached it; stopping at the middle keeps the beaker bottom out of the search.
  waterline_search: [-0.25, 0.5]
  # Middle part of the activity box width (fraction) whose columns are used for the
  # waterline profile, so the beaker's curved side walls are ignored.
  waterline_central_fraction: 0.5
  # The ROI top is raised to (waterline - this fraction of the frame height), so a fish
  # breaching the surface is still inside the ROI.
  waterline_margin_fraction: 0.05
  # Waterline confidence = peak / median of the row-gradient profile in the search band.
  # Below this value the waterline is flagged for a manual look (see overrides.yaml).
  min_waterline_confidence: 3.0
  # Expected length of one trial recording (all parts of a subject summed), in seconds,
  # and the allowed relative difference before the subject is flagged (0.05 = 5%).
  expected_duration_s: 1200
  duration_tolerance: 0.05
  # Parts of one subject count as having "different" frame rates only when they differ
  # by more than this fraction (0.01 = 1%); tiny header differences are normal.
  fps_tolerance: 0.01
  # Real color frames saved per video for the review page (scene-review), so a person
  # sees the actual picture, not only the computed background.
  n_review_frames: 6

tracking:
  # Analyse every n-th frame (1 = every frame). Times stay exact: frame_index / fps.
  frame_stride: 1
  # Shrink frames by this factor before analysis (0.5 = half size) for speed. Every
  # coordinate in the track file is converted back to original video pixels.
  scale: 1.0
  # Gaussian blur kernel as a fraction of the smaller frame side (rounded up to an odd
  # size, at least 3). Smooths compression noise before comparing with the background.
  blur_kernel_fraction: 0.01
  # Brightness difference from the background (0-255) that counts as "fish".
  diff_threshold: 18
  # Which differences count: darker = only pixels darker than the background (the fish
  # is darker than the water; lighter glare and highlights are ignored); both = darker
  # or lighter (for a fish that is not darker than its background).
  polarity: darker
  # Subtract each frame's median difference inside the ROI first, so a light flicker or
  # camera exposure change does not turn the whole ROI into foreground.
  remove_brightness_change: true
  # Opening (removes specks) + closing (fills holes in the body) kernel, as a fraction of
  # the smaller frame side (odd, at least 3).
  morph_kernel_fraction: 0.01
  # Blobs smaller than this fraction of the frame area are ignored (noise, bubbles).
  min_area_fraction: 0.0003
  # The blob that overlaps last frame's fish is kept, even when a mirror image of the fish
  # in the glass is bigger for a moment (fish turned toward the camera, or its see-through
  # body split into pieces). Only a blob more than this many times larger takes over, so
  # the track cannot stay stuck on a small mirror image.
  switch_area_ratio: 1.5
  # When no blob overlaps last frame's fish (after a gap, or a very fast move): a blob
  # within this many body lengths of the previous position is preferred over a larger
  # one farther away (keeps a ripple or shadow from stealing the track).
  max_jump_bl: 2.0
  # Body length for the jump test = median fitted length of the last N detections.
  body_length_window: 100
  # Missing runs up to this long (seconds) are linearly interpolated; longer ones stay empty.
  max_gap_s: 0.5
  # Head = the darkest spot of the fish (the eye). It must be at least this many gray
  # levels darker than the fish's typical pixel, otherwise no head is recorded (no clear eye).
  head_min_contrast: 15
  # The head tells which end of the body is the front (for pitch_deg) only when it lies at
  # least this fraction of the body length from the centre along the body axis. Closer
  # (e.g. fish facing the camera) the pitch is left empty.
  head_min_offset_fraction: 0.15
